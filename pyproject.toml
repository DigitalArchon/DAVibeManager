[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "davibemanager"
version = "0.1.0b15"
description = "A package manager for vibe-coded apps: have an AI add the feature you wish your app had, and keep that app up to date like any other. It also helps fix your computer. It works in a sealed sandbox and asks before touching anything."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "fastapi>=0.110",
    # uvicorn with the two packages of its "standard" extra that it uses here: websockets (the
    # window's events socket) and httptools (which it picks up when it is there). The extra's
    # others are for what DA Vibe Manager never does: python-dotenv, pyyaml and watchfiles for env
    # files, YAML log configs and --reload, and uvloop for a loop it never runs on (app.server_config
    # sets asyncio's: uvloop's fork handler hung the window on Ubuntu 26.04; the gateway's server runs
    # on the app's own loop). Until Nov 2026 the AppImage carried all four (DA Toolkit's 83426fc).
    "uvicorn>=0.29",
    "websockets>=12",
    "httptools>=0.6",
    "pywebview>=5",
    "keyring>=25",
    "tomli-w>=1.0",
    # attached images are re-encoded from pixels only (safety/images.py)
    "pillow>=10",
    # TEE attestation (llm/tee.py, dcap.py, nras.py)
    "cryptography>=42",
    # TEE attestation requests, the gateway's model forwarder
    "httpx>=0.27",
    # NanoGPT sends brotli-compressed replies; the OpenAI SDK's HTTP layer needs Brotli >= 1.2
    # 1.2.1 fixes CVE-2026-111497, an out-of-bounds write in the Brotli decoder (Oct 2026):
    # httpx and requests decode every Brotli reply with it, NanoGPT's included.
    "brotli>=1.2.1",
    # End-to-end encrypted NanoGPT Private Mode (llm/private_mode.py): Tinfoil's attestation
    # verifier and EHBP client. Pinned exactly: it holds the plaintext. tinfoil asks only for
    # tinfoil-ehbp>=0.3.0, so the library that seals and opens the bodies, and the HPKE under
    # it, are pinned here too, at the AppImage lock's versions (tests/test_private_mode.py
    # checks they agree): left unpinned, the Oct 9 lock took 0.4.0, a new request framing
    # never run against the enclave here; 0.15.0 and 0.4.1 were, on Oct 22 2026, before being
    # adopted (SealedLoreDocs design/private.md).
    "tinfoil==0.15.0",
    "tinfoil-ehbp==0.4.1",
    "pyhpke==0.6.5",
    # The CA bundle httpx, the openai client and tinfoil's requests trust. 2026.10.19 drops emSign
    # ECC Root CA - G3, whose eMudhra intermediates had recoverable keys (Oct 2026); the floor keeps
    # a relock from standing still on an older one. AppRun prefers the host's own CA store.
    "certifi>=2026.10.19",
    # pyasn1, which tinfoil and sigstore decode attestation certificates' extensions with: 0.6.5 fixes four
    # denials of service in its decoders (GHSA-2qm8-x737-gmw5, GHSA-fm9c-5rcf-2q5p, GHSA-mm57-4v3p-rchx,
    # GHSA-9m75-vc3g-4x39; Oct 2026). dnspython, under pydantic's email-validator: 2.9.0 fixes one in its
    # name parser (GHSA-45c3-73f7-pv4m). The AppImage's lock stood on pyasn1 0.6.4; the floors keep a relock
    # from standing still on either (DA Assistant's, Nov 2026).
    "pyasn1>=0.6.5",
    "dnspython>=2.9.0",
    # The builder (builder/bridge.py). Pinned exactly: its bundled Claude Code CLI is what the
    # workspace image runs (workspace/pins.py holds that binary's hash)
    "claude-agent-sdk==0.2.164",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
davibemanager = "davibemanager.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
davibemanager = ["web/*.html", "web/*.js", "web/*.css", "web/*.svg", "web/vendor/*", "workspace/image/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["podman: needs rootless Podman and network (builds the workspace image); run with -m podman"]
addopts = "-m 'not podman'"
